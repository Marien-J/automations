[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "automations"
version = "0.1.0"
description = "Screen-based (visual) automations built on the autokit framework"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "numpy>=1.24",
    "opencv-python>=4.8",   # use opencv-python-headless on machines without a display (tests/CI)
    "mss>=9.0",
    "pynput>=1.7",
    "PyYAML>=6.0",
    "Pillow>=10.1",         # only for the simulators' text rendering
]

[project.optional-dependencies]
dev = ["pytest>=8", "ruff>=0.5"]

[tool.setuptools.packages.find]
include = ["autokit*", "osrskit*", "automations*"]

[tool.setuptools.package-data]
"*" = ["*.yaml", "*.md"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"

[tool.ruff]
line-length = 120
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP"]
